name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Godot iOS IPA
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' ! -path '*/.git/*' | head -n 1 || true)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::没有找到项目 ZIP，请先上传 velocity_godot_phase1(1).zip"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/project_src"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/project_src"

          PROJECT_FILE="$(find "$RUNNER_TEMP/project_src" -name project.godot -type f | head -n 1 || true)"

          if [[ -z "$PROJECT_FILE" ]]; then
            echo "::error::ZIP 内没有找到 project.godot"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "项目目录：$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"

          unzip -q "$RUNNER_TEMP/godot/godot.zip" \
            -d "$RUNNER_TEMP/godot/unpacked"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot/unpacked" -type f -path '*/Contents/MacOS/Godot' | head -n 1 || true)"

          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::找不到 Godot 可执行文件"
            find "$RUNNER_TEMP/godot/unpacked" -maxdepth 5 -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install iOS export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/templates"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates/templates.tpz"

          unzip -q "$RUNNER_TEMP/templates/templates.tpz" \
            -d "$RUNNER_TEMP/templates/unpacked"

          TEMPLATE_SOURCE="$RUNNER_TEMP/templates/unpacked/templates"
          TEMPLATE_DEST="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"

          if [[ ! -d "$TEMPLATE_SOURCE" ]]; then
            echo "::error::没有找到导出模板目录"
            find "$RUNNER_TEMP/templates/unpacked" -maxdepth 3 -print
            exit 1
          fi

          mkdir -p "$TEMPLATE_DEST"
          cp -R "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"

          echo "导出模板已安装"
          ls -la "$TEMPLATE_DEST"

      - name: Fix iOS export preset
        shell: bash
        run: |
          set -euo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [[ ! -f "$PRESET" ]]; then
            cat > "$PRESET" <<'PRESET_EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.velocity.game"
          application/signature=""
          application/short_version="1.0"
          application/version="1.0"
          application/min_ios_version="13.0"
          architectures/arm64=true
          architectures/simulator=false
          PRESET_EOF
          fi

          python3 - "$PRESET" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")

          team_id = 'application/app_store_team_id="ABCDE12345"'

          if re.search(r'(?m)^\s*application/app_store_team_id\s*=', content):
              content = re.sub(
                  r'(?m)^\s*application/app_store_team_id\s*=.*$',
                  team_id,
                  content
              )
          else:
              match = re.search(r'(?m)^\[preset\.0\.options\]\s*$', content)
              if not match:
                  raise SystemExit(
                      "找不到 [preset.0.options]，无法自动添加 Team ID"
                  )
              pos = match.end()
              content = content[:pos] + "\n" + team_id + content[pos:]

          path.write_text(content, encoding="utf-8")
          print("已设置临时 Team ID 占位值")
          PY

          echo "当前导出预设："
          cat "$PRESET"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Export iOS project
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_DIR="$RUNNER_TEMP/godot_ios_export"
          mkdir -p "$EXPORT_DIR"

          "$GODOT_BIN" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-release "iOS" \
            "$EXPORT_DIR/Velocity.xcodeproj"

          echo "导出目录内容："
          find "$EXPORT_DIR" -maxdepth 5 -print | head -n 200

          XCODEPROJ="$(find "$EXPORT_DIR" -name '*.xcodeproj' -type d | head -n 1 || true)"

          if [[ -z "$XCODEPROJ" ]]; then
            echo "::error::Godot 没有生成 Xcode 工程，请检查上面的导出错误"
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -project "$XCODEPROJ" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 4 -name '*.app' -type d | head -n 1 || true)"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::编译完成后没有找到 .app 文件"
            find "$DERIVED/Build/Products" -maxdepth 5 -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/PROJECT-VELOCITY-unsigned.ipa" \
              Payload
          )

          ls -lh "$GITHUB_WORKSPACE/PROJECT-VELOCITY-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-VELOCITY-unsigned-IPA
          path: PROJECT-VELOCITY-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
