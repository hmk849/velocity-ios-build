name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Phase 3 Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Phase 3 Godot project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/velocity_godot_phase3.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::找不到 velocity_godot_phase3.zip，请确认它位于仓库根目录。"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          ditto -x -k "$ZIP_FILE" "$GITHUB_WORKSPACE/extracted"

          PROJECT_FILE="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f -name project.godot \
              -not -path '*/.godot/*' -print -quit
          )"

          if [[ -z "$PROJECT_FILE" ]]; then
            echo "::error::ZIP 中没有找到 project.godot。"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "使用源码：$ZIP_FILE"
          echo "项目目录：$PROJECT_DIR"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -oq "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot-bin"

          GODOT_BIN="$(
            find "$RUNNER_TEMP/godot-bin" \
              -type f -name Godot -print -quit
          )"

          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::找不到 Godot 可执行文件。"
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot iOS export template
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          unzip -oq "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          TEMPLATE_SOURCE="$(
            find "$RUNNER_TEMP/templates" \
              -type f -name ios.zip -print -quit
          )"

          if [[ -z "$TEMPLATE_SOURCE" ]]; then
            echo "::error::导出模板中没有找到 ios.zip。"
            find "$RUNNER_TEMP/templates" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          cp "$TEMPLATE_SOURCE" "$TEMPLATE_DIR/ios.zip"
          echo "iOS 导出模板安装完成。"

      - name: Generate fallback app icon
        shell: bash
        run: |
          set -euo pipefail

          ICON_DIR="$RUNNER_TEMP/generated_icons"
          mkdir -p "$ICON_DIR"

          python3 - "$ICON_DIR/icon.png" <<'PY'
          import struct
          import zlib
          import sys

          size = 1024
          row = b'\x00' + bytes([35, 75, 145, 255]) * size
          raw = row * size

          def chunk(name, data):
              return (
                  struct.pack(">I", len(data))
                  + name
                  + data
                  + struct.pack(">I", zlib.crc32(name + data) & 0xffffffff)
              )

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(
                  b'IHDR',
                  struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              )
              + chunk(b'IDAT', zlib.compress(raw))
              + chunk(b'IEND', b'')
          )

          with open(sys.argv[1], "wb") as f:
              f.write(png)
          PY

          echo "ICON_DIR=$ICON_DIR" >> "$GITHUB_ENV"

      - name: Configure iOS export preset
        shell: bash
        run: |
          set -euo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [[ ! -f "$PRESET" ]]; then
            cat > "$PRESET" <<'PRESET_EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.velocity.game"
          application/signature=""
          application/short_version="1.0"
          application/version="1.0"
          application/min_ios_version="13.0"
          architectures/arm64=true
          architectures/simulator=false
          PRESET_EOF
          fi

          python3 - "$PRESET" "$ICON_DIR/icon.png" <<'PY'
          import re
          import sys
          from pathlib import Path

          preset_path = Path(sys.argv[1])
          icon_path = Path(sys.argv[2]).as_posix()
          text = preset_path.read_text(encoding="utf-8")

          sections = re.split(r'(?m)(?=^\[)', text)

          if not any(s.startswith("[preset.0]") for s in sections):
              raise SystemExit("找不到 [preset.0]。")

          if not any(s.startswith("[preset.0.options]") for s in sections):
              raise SystemExit("找不到 [preset.0.options]。")

          def set_key(section, key, value):
              pattern = r'(?m)^\s*' + re.escape(key) + r'\s*=.*$'
              line = f'{key}="{value}"'

              if re.search(pattern, section):
                  return re.sub(pattern, lambda _: line, section)

              return section.rstrip() + "\n" + line + "\n"

          icon_keys = [
              "icons/iphone_120x120",
              "icons/iphone_180x180",
              "icons/ipad_76x76",
              "icons/ipad_152x152",
              "icons/ipad_167x167",
              "icons/app_store_1024x1024",
              "icons/spotlight_40x40",
              "icons/spotlight_80x80",
              "icons/settings_29x29",
              "icons/settings_58x58",
              "icons/settings_87x87",
              "icons/notification_20x20",
              "icons/notification_40x40",
              "icons/notification_60x60",
          ]

          for i, section in enumerate(sections):
              if section.startswith("[preset.0]"):
                  section = set_key(
                      section, "application/app_store_team_id", "ABCDE12345"
                  )
                  section = set_key(
                      section, "application/bundle_identifier", "com.velocity.game"
                  )
                  sections[i] = section

              elif section.startswith("[preset.0.options]"):
                  section = set_key(
                      section, "application/app_store_team_id", "ABCDE12345"
                  )
                  section = set_key(
                      section, "application/bundle_identifier", "com.velocity.game"
                  )

                  for key in icon_keys:
                      section = set_key(section, key, icon_path)

                  sections[i] = section

          preset_path.write_text("".join(sections), encoding="utf-8")
          print("已配置占位 Team ID、Bundle ID 和图标。")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --import

      - name: Generate Xcode project
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/ios"

          set +e
          "$GODOT_BIN" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "iOS" \
            "$GITHUB_WORKSPACE/build/ios"

          GODOT_STATUS=$?
          set -e

          XCODEPROJ="$(
            find "$GITHUB_WORKSPACE/build" \
              -type d -name '*.xcodeproj' -print -quit
          )"

          if [[ -z "$XCODEPROJ" ]]; then
            echo "::error::Godot 没有生成 Xcode 项目。"
            echo "Godot 导出退出码：$GODOT_STATUS"
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "找到 Xcode 项目：$XCODEPROJ"
          echo "Godot 导出退出码：$GODOT_STATUS"
          echo "继续尝试关闭签名构建。"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          SCHEME="$(
            xcodebuild -list -json -project "$XCODEPROJ" |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get("project", {}).get("schemes", [])
          print(schemes[0] if schemes else "")
          '
          )"

          if [[ -z "$SCHEME" ]]; then
            echo "::error::无法识别 Xcode scheme。"
            xcodebuild -list -project "$XCODEPROJ"
            exit 1
          fi

          echo "使用 scheme：$SCHEME"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"

          APP_PATH="$(
            find "$PRODUCTS" \
              -type d -name '*.app' \
              -path '*iphoneos*' -print -quit
          )"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::没有找到 iOS .app 构建产物。"
            find "$PRODUCTS" -maxdepth 6 -print | head -n 200
            exit 1
          fi

          IPA_DIR="$RUNNER_TEMP/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          ditto "$APP_PATH" "$IPA_DIR/Payload/$(basename "$APP_PATH")"

          cd "$IPA_DIR"
          zip -qry "$GITHUB_WORKSPACE/unsigned-velocity.ipa" Payload

          if [[ ! -s "$GITHUB_WORKSPACE/unsigned-velocity.ipa" ]]; then
            echo "::error::IPA 文件生成失败。"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/unsigned-velocity.ipa"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-phase3-unsigned-ipa
          path: unsigned-velocity.ipa
          if-no-files-found: error
          retention-days: 7
