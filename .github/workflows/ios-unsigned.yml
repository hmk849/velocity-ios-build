name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' ! -path '*/extracted/*' | head -n 1 || true)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::仓库中没有找到项目 ZIP。"
            exit 1
          fi

          echo "项目压缩包：$ZIP_FILE"
          ditto -x -k "$ZIP_FILE" "$GITHUB_WORKSPACE/extracted"

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f -name project.godot -not -path '*/.godot/*' | head -n 1 || true)"
          if [[ -z "$PROJECT_FILE" ]]; then
            echo "::error::ZIP 中没有找到 project.godot。"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot 项目目录：$PROJECT_DIR"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -oq "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -type f -name Godot -print -quit)"
          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::找不到 Godot 可执行文件。"
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"

          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/templates" -type f -name ios.zip -print -quit || true)"
          if [[ -z "$TEMPLATE_SOURCE" ]]; then
            echo "::error::导出模板中找不到 ios.zip。"
            find "$RUNNER_TEMP/templates" -maxdepth 4 -type f | head -n 80
            exit 1
          fi

          cp "$TEMPLATE_SOURCE" "$TEMPLATE_DIR/ios.zip"
          echo "iOS 导出模板已安装。"

      - name: Generate fallback app icon
        shell: bash
        run: |
          set -euo pipefail

          ICON_DIR="$RUNNER_TEMP/generated_icons"
          mkdir -p "$ICON_DIR"

          python3 - "$ICON_DIR/icon.png" <<'PY'
          import struct, zlib, sys

          size = 1024
          row = b'\x00' + bytes([35, 75, 145, 255]) * size
          raw = row * size

          def chunk(name, data):
              return (struct.pack(">I", len(data)) + name + data
                      + struct.pack(">I", zlib.crc32(name + data) & 0xffffffff))

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(raw))
              + chunk(b'IEND', b'')
          )

          with open(sys.argv[1], "wb") as f:
              f.write(png)
          PY

          echo "ICON_DIR=$ICON_DIR" >> "$GITHUB_ENV"
          file "$ICON_DIR/icon.png"

      - name: Repair all iOS icon settings
        shell: bash
        run: |
          set -euo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [[ ! -f "$PRESET" ]]; then
            cat > "$PRESET" <<'PRESET_EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.velocity.game"
          application/signature=""
          application/short_version="1.0"
          application/version="1.0"
          application/min_ios_version="13.0"
          architectures/arm64=true
          architectures/simulator=false
          PRESET_EOF
          fi

          python3 - "$PRESET" "$ICON_DIR/icon.png" <<'PY'
          import re, sys
          from pathlib import Path

          preset = Path(sys.argv[1])
          icon = Path(sys.argv[2]).as_posix()
          text = preset.read_text(encoding="utf-8")

          if "[preset.0.options]" not in text:
              raise SystemExit("找不到 [preset.0.options]。")

          # Godot 4.3 的 iOS 导出预设可能包含多种图标：
          # iPhone、iPad、Spotlight、Settings、Notification 和 App Store。
          known_icons = [
              "icons/iphone_120x120",
              "icons/iphone_180x180",
              "icons/ipad_76x76",
              "icons/ipad_152x152",
              "icons/ipad_167x167",
              "icons/app_store_1024x1024",
              "icons/spotlight_40x40",
              "icons/spotlight_80x80",
              "icons/settings_29x29",
              "icons/settings_58x58",
              "icons/settings_87x87",
              "icons/notification_20x20",
              "icons/notification_40x40",
              "icons/notification_60x60",
          ]

          sections = re.split(r'(?m)(?=^\[)', text)
          found = False

          for i, section in enumerate(sections):
              if section.startswith("[preset.0.options]"):
                  found = True

                  # 所有已存在的图标项统一指向有效 PNG，
                  # 包括原来值为空的 spotlight_40x40 等项目。
                  section = re.sub(
                      r'(?m)^(\s*icons/[^=]+\s*=\s*).*$',
                      lambda m: m.group(1).rstrip() + '="' + icon + '"',
                      section
                  )

                  for key in known_icons:
                      pattern = rf'(?m)^\s*{re.escape(key)}\s*=.*$'
                      line = f'{key}="{icon}"'
                      if re.search(pattern, section):
                          section = re.sub(pattern, line, section)
                      else:
                          section = section.rstrip() + "\n" + line + "\n"

                  sections[i] = section
                  break

          if not found:
              raise SystemExit("没有找到 [preset.0.options]。")

          text = "".join(sections)

          # 修正占位团队 ID 和 Bundle ID。
          def set_option(content, key, value):
              parts = re.split(r'(?m)(?=^\[)', content)
              for i, part in enumerate(parts):
                  if part.startswith("[preset.0]"):
                      pattern = rf'(?m)^\s*{re.escape(key)}\s*=.*$'
                      line = f'{key}="{value}"'
                      if re.search(pattern, part):
                          part = re.sub(pattern, line, part)
                      else:
                          part = part.rstrip() + "\n" + line + "\n"
                      parts[i] = part
                      return "".join(parts)
              raise SystemExit("找不到 [preset.0]。")

          text = set_option(text, "application/app_store_team_id", "ABCDE12345")
          text = set_option(text, "application/bundle_identifier", "com.velocity.game")

          preset.write_text(text, encoding="utf-8")

          print("已配置的图标项：")
          for line in text.splitlines():
              if line.startswith("icons/"):
                  print(line)
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --editor --import

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/ios"

          "$GODOT_BIN" --headless \
            --path "$PROJECT_DIR" \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/build/ios"

          echo "导出目录："
          find "$GITHUB_WORKSPACE/build" -maxdepth 4 -print | head -n 200

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          XCODEPROJ="$(find "$GITHUB_WORKSPACE/build" -type d -name '*.xcodeproj' -print -quit || true)"
          if [[ -z "$XCODEPROJ" ]]; then
            echo "::error::没有找到 Xcode 项目，检查 Godot 导出日志。"
            exit 1
          fi

          echo "Xcode 项目：$XCODEPROJ"

          SCHEME="$(xcodebuild -list -json -project "$XCODEPROJ" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print((d.get("project",{}).get("schemes") or [""])[0])
          ')"

          if [[ -z "$SCHEME" ]]; then
            echo "::error::无法识别 Xcode scheme。"
            exit 1
          fi

          echo "Scheme：$SCHEME"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d -name '*.app' -path '*iphoneos*' -print -quit || true)"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::构建完成后没有找到 iOS .app。"
            find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -maxdepth 5 -print | head -n 200
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/unsigned-velocity.ipa" Payload

          test -s "$GITHUB_WORKSPACE/unsigned-velocity.ipa"
          ls -lh "$GITHUB_WORKSPACE/unsigned-velocity.ipa"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-unsigned-ipa
          path: unsigned-velocity.ipa
          if-no-files-found: error
          retention-days: 7
